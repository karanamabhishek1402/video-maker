<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Default dark palette — override from context/<project>/design.md,
     fallback: video-studio/references/design-default.md */
  :root { --bg:#101318; --fg:#EDECE8; --red:#E8384A; }
  html,body { margin:0; width:1920px; height:1080px; background:var(--bg);
              font-family:system-ui,sans-serif; overflow:hidden; }
  .clip { position:absolute; inset:0; }
  #eyebrow { position:absolute; left:160px; top:300px; color:var(--red);
             font-family:monospace; font-size:26px; letter-spacing:6px; opacity:0; }
  #headline { position:absolute; left:160px; top:350px; color:var(--fg);
              font-size:96px; font-weight:700; max-width:1300px; opacity:0; }
  #card { position:absolute; left:160px; top:600px; width:420px; padding:32px;
          border:1px solid rgba(237,236,232,.25); border-radius:12px;
          color:var(--fg); font-size:28px; opacity:0; }
  #card small { display:block; margin-top:8px; font-family:monospace;
                font-size:18px; opacity:.6; letter-spacing:2px; }
</style>
</head>
<body>
<div class="clip" data-composition-id="main" data-width="1920" data-height="1080"
     data-start="0" data-duration="10">
  <div id="eyebrow">EYEBROW · CONTEXT LABEL</div>
  <div id="headline">The headline makes <em>one</em> claim.</div>
  <div id="card">A mechanism card<small>MONO TAG · EVIDENCE GRADE</small></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
  const tl = gsap.timeline({ paused: true });

  // Beat times come from words.json: the triggering word's start + 0.3s
  // (the mux adelay lead). Rewrite this WHOLE block when the VO changes —
  // never patch individual time literals.

  // Beat 1 — e.g. "headline" word starts at 0.42 in words.json → 0.72
  tl.to("#eyebrow",  { opacity: 1, duration: 0.4 }, 0.72);
  tl.to("#headline", { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 1.0);

  // Beat 2 — e.g. "mechanism" at 3.1 → 3.4
  tl.fromTo("#card", { opacity: 0, y: 24 },
                     { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 3.4);

  // End fade
  tl.to("body", { opacity: 0, duration: 0.5 }, 9.5);

  window.__timelines = { main: tl };
</script>
</body>
</html>
